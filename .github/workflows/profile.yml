name: Profile cards

# İstatistik/dil kartlarını ve katkı yılanını her gün yeniden üretip
# `output` dalına koyar; README görselleri o daldan okur.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stats and language cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cards.py "${{ github.repository_owner }}" dist

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#e5484d&color_dots=#161b22,#4a1d20,#7a2a2e,#b33a3f,#e5484d

      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "profile cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
