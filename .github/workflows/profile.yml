name: Profile cards

# İstatistik/dil kartlarını 4 saatte bir yeniden üretip
# `output` dalına koyar; README görselleri o daldan okur.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stats and language cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cards.py "${{ github.repository_owner }}" dist

      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "profile cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
