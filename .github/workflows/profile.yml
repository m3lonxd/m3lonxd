name: Profile cards

# İstatistik/dil kartlarını 10 dakikada bir yeniden üretir; yeni commit, yeni depo
# ya da dil değişimi kartları değiştirmişse `output` dalına koyar, aynıysa hiçbir şey
# yazmaz. README görselleri o daldan okur.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/cards.py", "assets/card-font.woff2", "assets/card-eyes.png", "assets/card-hand.png", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stats and language cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cards.py "${{ github.repository_owner }}" dist

      - name: Compare with published cards
        id: diff
        run: |
          mkdir -p old
          if git fetch -q --depth=1 origin output; then
            git archive FETCH_HEAD | tar -x -C old
          fi
          if diff -rq dist old >/dev/null; then
            echo "Kartlar değişmedi; yayın atlanıyor."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            diff -rq dist old || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to output branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "profile cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
