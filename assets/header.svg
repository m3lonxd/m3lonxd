<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="m3lon — browsers, real-time apps and small tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#120a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5484d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb224" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffd7d8"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="280" rx="24"/></clipPath>
    <style>
      .orb { animation: drift 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .chip { font: 500 15px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: #f1f3f7; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(140px, 30px); } }
      @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-160px, -20px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .orb, .orb2, .caret { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle class="orb" cx="300" cy="80" r="260" fill="url(#glow)"/>
    <circle class="orb2" cx="980" cy="230" r="240" fill="url(#glow2)"/>
    <rect width="1200" height="280" fill="url(#sheen)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="279" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <text x="72" y="140" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#ink)">m3lon</text>
  <rect class="caret" x="364" y="76" width="8" height="70" rx="2" fill="#e5484d"/>

  <text x="76" y="186" font-family="Inter, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="22" fill="#c9ced8">browsers, real-time web apps and small tools</text>

  <g transform="translate(76 214)">
    <rect width="132" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <text class="chip" x="66" y="22" text-anchor="middle">gecko / c++</text>
    <rect x="144" width="120" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <text class="chip" x="204" y="22" text-anchor="middle">python</text>
    <rect x="276" width="152" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <text class="chip" x="352" y="22" text-anchor="middle">javascript</text>
    <rect x="440" width="120" height="34" rx="17" fill="#e5484d" fill-opacity=".18" stroke="#e5484d" stroke-opacity=".55"/>
    <text class="chip" x="500" y="22" text-anchor="middle">three.js</text>
  </g>

  <g transform="translate(1040 70)" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5">
    <rect width="88" height="64" rx="12"/>
    <path d="M0 18H88"/>
    <circle cx="12" cy="9" r="2.6" fill="#e5484d" stroke="none"/>
    <circle cx="22" cy="9" r="2.6" fill="#ffb224" stroke="none"/>
    <circle cx="32" cy="9" r="2.6" fill="#46a758" stroke="none"/>
    <path d="M14 34l8 6-8 6M30 48h18" stroke="#e5484d" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
